name: Build Publish

on:
  push:
    branches:
    - "*"  # run for branches
    tags:
    - "*"  # run for tags

jobs:
  build-image:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: ["multi-cloud", "aks", "eks", "gke", "scw"]

    permissions:
      id-token: write # required for keyless signing
      packages: write # required for docker push

    steps:
    - name: "Free disk space"
      # https://github.com/actions/runner-images/issues/2840#issuecomment-790492173
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf $AGENT_TOOLSDIRECTORY

    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: "Setup buildx"
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: "Docker login ghcr.io"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: "Build ${{ matrix.target }} image"
      env:
        DOCKER_PUSH: true
        DOCKER_TARGET: ${{ matrix.target }}
      run: make build

    - name: "Sign Images"
      env:
        COSIGN_EXPERIMENTAL: true
      run: |
        cosign sign --yes -a GIT_HASH=${{ github.sha }} -a GIT_REF=${{ github.ref }} ghcr.io/kbst/terraform-kubestack/dev:test-${{ github.sha }}-${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    needs: [build-image]

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "Use local state for CI tests"
      # the CI credentials cannot read the GCS state backend configured in tests/state.tf
      # deleting it makes the CI tests run against a fresh local state
      run: rm tests/state.tf

    - name: "Docker login ghcr.io"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: "Start test container"
      # mirrors the Makefile's .run-container but uses the image
      # that the build-image job already built and pushed
      env:
        KBST_AUTH_AWS: ${{ secrets.KBST_AUTH_AWS }}
        KBST_AUTH_AZ: ${{ secrets.KBST_AUTH_AZ }}
        KBST_AUTH_GCLOUD: ${{ secrets.KBST_AUTH_GCLOUD }}
        KBST_AUTH_SCW: ${{ secrets.KBST_AUTH_SCW }}
      run: |
        docker run \
          --detach \
          --name test-container-${{ github.sha }} \
          --rm \
          -v `pwd`:/infra:z \
          -e KBST_AUTH_AWS \
          -e KBST_AUTH_AZ \
          -e KBST_AUTH_GCLOUD \
          -e KBST_AUTH_SCW \
          -e HOME=/infra/tests/.user \
          --workdir /infra/tests \
          ghcr.io/kbst/terraform-kubestack/dev:test-${{ github.sha }}-multi-cloud \
          sleep infinity

    - name: "Common module unit tests"
      # make validate does not cover the common/ modules
      run: make unittests GIT_SHA=${{ github.sha }}

    - name: "OpenTofu validate"
      run: make validate GIT_SHA=${{ github.sha }}

    - name: "OpenTofu plan"
      run: make plan GIT_SHA=${{ github.sha }}

  publish-image:
    runs-on: ubuntu-latest
    needs: [test]

    strategy:
      matrix:
        target: ["multi-cloud", "aks", "eks", "gke", "scw"]

    steps:
    - name: Install ORAS
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

    - name: "Docker login docker.io"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: kbstci
        password: ${{ secrets.DOCKER_AUTH }}

    - name: "Docker login ghcr.io"
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: "Docker push"
      # oras copy -r copies the images and the signature from one place to another
      # then we dont need to sign again the same image
      run: |
        SOURCE_IMAGE=ghcr.io/kbst/terraform-kubestack/dev:test-${{ github.sha }}-${{ matrix.target }}
        VERSION=${{ github.sha }}
        IMAGE_NAME=ghcr.io/kbst/terraform-kubestack/dev
        if [[ $GITHUB_REF = refs/tags/v* ]]
        then
          VERSION=$(echo $GITHUB_REF | sed -e "s#^refs/tags/##")
          IMAGE_NAME=docker.io/kubestack/framework
        fi
        TARGET_IMAGE=$IMAGE_NAME:$VERSION
        if [[ ${{ matrix.target }} != multi-cloud ]]
        then
          TARGET_IMAGE=$TARGET_IMAGE-${{ matrix.target }}
        fi
        echo "Source image $SOURCE_IMAGE will be pushed to $TARGET_IMAGE"
        oras copy -r $SOURCE_IMAGE $TARGET_IMAGE
